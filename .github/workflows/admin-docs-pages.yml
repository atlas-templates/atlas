name: Admin docs (GitHub Pages)

on:
  push:
    branches: ["main"]
    paths: ["docs/admin/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build admin docs
        run: |
          pip install mkdocs-material==9.7.7
          cd docs/admin && mkdocs build -d "$GITHUB_WORKSPACE/site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
