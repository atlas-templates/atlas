name: Template indienen
description: Deel een template voor gekoppelde data met andere Atlas-beheerders. Na goedkeuring verschijnt hij op de templatepagina in de beheerdocumentatie.
title: "[Template] Nieuwe inzending"
labels: ["template-ingediend"]
body:
  - type: markdown
    attributes:
      value: |
        Bedankt voor het delen! Een template is één zip-bestand met exportbestanden uit Atlas.
        Verzamel ze via de exportfunctie in het beheer, maak er één zip-bestand van en vink hieronder aan
        welke bestanden erin zitten.

        Je hoeft de titel hierboven niet aan te passen: na het indienen wordt hij automatisch
        vervangen door de naam van je template.

        Direct na het indienen controleert een automatische check je zip. Binnen een minuut zie je het
        resultaat als reactie in je issue. Daarna bekijkt een beheerder je inzending. Na goedkeuring
        staat de template binnen een paar minuten in de lijst.

        **Let op:** alles wat je hier indient is openbaar. Haal wachtwoorden, API-sleutels, interne URL's
        en persoonsgegevens uit de bestanden voordat je ze deelt.
  - type: input
    id: naam
    attributes:
      label: Naam van de template
      description: Een korte, duidelijke naam.
      placeholder: Subbuurten met wijk- en buurtrelaties
    validations:
      required: true
  - type: textarea
    id: beschrijving
    attributes:
      label: Beschrijving
      description: |
        Welke gekoppelde data bevat de template en wat moet een ander aanpassen voor de eigen omgeving?
        Je kunt ook maximaal 5 schermafbeeldingen (PNG, JPG, GIF of WebP, max. 5 MB) in dit veld slepen.
    validations:
      required: true
  - type: input
    id: versie
    attributes:
      label: Atlas-versie
      description: Uit welke versie van Atlas komt de export? Import werkt alleen betrouwbaar tussen gelijke versies.
      placeholder: "3.61.0"
      value: "3.61.0"
    validations:
      required: true
  - type: checkboxes
    id: bestanden
    attributes:
      label: Bestanden in de zip
      description: Vink aan welke exportbestanden in de zip zitten. De zip mag geen andere bestanden bevatten.
      options:
        - label: "`layers_datum.json`"
        - label: "`authorizations_datum.json`"
        - label: "`tables_datum.json`"
        - label: "`sources_datum.json`"
        - label: "`categories_datum.json`"
  - type: upload
    id: zip
    attributes:
      label: Zip-bestand
      description: Upload precies één .zip-bestand met de aangevinkte exportbestanden.
    validations:
      required: true
      accept: ".zip"
  - type: checkboxes
    id: akkoord
    attributes:
      label: Bevestiging
      options:
        - label: De bestanden bevatten geen wachtwoorden, sleutels of persoonsgegevens en mogen openbaar gedeeld worden.
          required: true
